<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://unpkg.com/react@17.0.2/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const root = document.getElementById("root");
      function TimeConverter() {
        const [minutes, setMinutes] = React.useState(0);
        const [hours, setHours] = React.useState(0);
        const [dir, setDir] = React.useState(true)
        
        const onChange = (e) => {
          // console.log(e.target, e.target.value)
          dir ? setMinutes(e.target.value): setHours(e.target.value)
        }

        const onClick = () => {
          setMinutes(0);
          setHours(0);
        };
        const toggle = () => {
          onClick();
          setDir(!dir);
        };
        return (
          <>
            <form>
              <p>{dir? "true" : "false"}</p>
              <label htmlFor="minutes" >분</label>
              <input id="minutes" type="number" placeholder="분" 
              value={dir? minutes: hours*60} onChange={onChange} disabled={dir ? false : true} />
              <label htmlFor="hours" >시간</label>
              <input id="hours" type="number" placeholder="시간" 
              value={dir ? Math.round(minutes/60):hours} 
              disabled={dir ? true : false} onChange={onChange}/>
            </form>
              
            <button onClick={onClick}>reset</button>
            <button onClick={toggle}>{dir? "분을 시간으로 변경" : "시간을 분으로 변경"}</button>
          </>
        );
      };
      
      function CurrencyConverter() {
        const [minutes, setMinutes] = React.useState(0);
        const [hours, setHours] = React.useState(0);
        const [dir, setDir] = React.useState(true)
        
        const onChange = (e) => {
          // console.log(e.target, e.target.value)
          dir ? setMinutes(e.target.value): setHours(e.target.value)
        }

        const onClick = () => {
          setMinutes(0);
          setHours(0);
        };
        const toggle = () => {
          onClick();
          setDir(!dir);
        };
        return (
          <>
            <form>
              <p>{dir? "true" : "false"}</p>
              <label htmlFor="minutes" >원</label>
              <input id="minutes" type="number" placeholder="원" 
              value={dir? minutes: hours*60} onChange={onChange} disabled={dir ? false : true} />
              <label htmlFor="hours" >달러</label>
              <input id="hours" type="number" placeholder="달러" 
              value={dir ? Math.round(minutes/60):hours} 
              disabled={dir ? true : false} onChange={onChange}/>
            </form>
              
            <button onClick={onClick}>reset</button>
            <button onClick={toggle}>{dir? "원을 달러로 변경" : "달러를 원으로 변경"}</button>
          </>
        );
      };
      
      function App() {
        const [index, setIndex] = React.useState(0)
        const onChange = (e) => {
          setIndex(e.target.value)
        }
        return (
          <>
            <h1>Converter</h1>

            <select value={index} onChange={onChange}>
                <option value="0">옵션을 선택하세요</option>
                <option value="1">TimeConverter</option>
                <option value="2">CurrencyConverter</option>
            </select>
            <hr/>
            {index == 0 ? "변환할 단위를 선택하세요." : null}
            {index == 1 ? <TimeConverter /> : null} 
            {index == 2 ? <CurrencyConverter /> : null}
          </>
        )
      }
      console.log("렌더 함수가 호출됩니다.");
      ReactDOM.render(<App />, root);
    </script>
  </body>
</html>
